name: NAVIGATOR runtime tests

on:
  push:
    branches:
      - navigator-invariant-runtime
  pull_request:
    branches:
      - mvp-core

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit, minister, API, and shadow tests
        run: pytest -q
