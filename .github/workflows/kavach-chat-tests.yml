name: Kavach Chat extension tests

on:
  pull_request:
    branches: [mvp-core]
    paths:
      - 'vscode-extension/**'
      - '.vscode/launch.json'
      - '.github/workflows/kavach-chat-tests.yml'
  push:
    branches: [mvp-core]
    paths:
      - 'vscode-extension/**'
      - '.vscode/launch.json'
      - '.github/workflows/kavach-chat-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify extension syntax and decision rendering tests
        working-directory: vscode-extension
        run: npm run verify
